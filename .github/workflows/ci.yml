# 持续集成分别验证 Python、Go、Web、文档和 Compose，避免单一脚本掩盖失败来源。
name: quality

on:
  push:
  pull_request:

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装控制面和插件 SDK
        run: python -m pip install -e sdk/python -e 'control-plane[dev]'
      - name: 运行测试和静态检查
        run: |
          cd control-plane
          python -m pytest
          cd ..
          python -m pytest sdk/python/tests lab/tests experiments/tests
          python -m ruff check control-plane/src control-plane/tests sdk/python/src sdk/python/tests plugins lab/app lab/tests scripts experiments
          python -m mypy --strict sdk/python/src
          cd control-plane
          python -m mypy src

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          # 仓库包含两个独立 Go 模块，缓存键必须同时跟踪两份依赖锁定文件。
          cache-dependency-path: |
            agent/go.sum
            sdk/go/go.sum
      - name: 验证 Agent
        working-directory: agent
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          cd ../sdk/go
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 检查、测试并构建前端
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run format:check
          pnpm run test
          pnpm run build

  documentation-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 检查中文说明和部署配置
        env:
          # 这些固定值只用于 Compose 语法解析，CI 不启动任何持权服务。
          AIOPS_AGENT_SHARED_SECRET: ci-agent-secret-0123456789abcdef
          AIOPS_LAB_CONTROL_TOKEN: ci-lab-token-0123456789abcdef
          POSTGRES_PASSWORD: ci-postgres-password
        run: |
          python -m pip install PyYAML
          python scripts/check_chinese_docs.py
          docker compose -f deployments/compose.yaml config --quiet
          docker compose -f deployments/compose.yaml -f deployments/compose.lite.yaml config --quiet

  portfolio-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 启动并验收 Redis 故障闭环
        env:
          AIOPS_AGENT_SHARED_SECRET: ci-agent-secret-0123456789abcdef
          AIOPS_LAB_CONTROL_TOKEN: ci-lab-token-0123456789abcdef
          POSTGRES_PASSWORD: ci-postgres-password
        run: |
          trap 'docker compose -f deployments/compose.yaml down -v' EXIT
          docker compose -f deployments/compose.yaml up --build -d
          python scripts/test_portfolio_demo.py
          docker compose -f deployments/compose.yaml ps
