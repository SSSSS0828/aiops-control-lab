# OTel Collector 接收标准 OTLP，并把日志写入 Loki、指标暴露给 Prometheus。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # 直接读取 Docker JSON 日志，避免为阶段一再部署 Promtail 或 Alloy。
  filelog/docker:
    include: [/var/lib/docker/containers/*/*.log]
    start_at: end
    include_file_path: true
    operators:
      - type: container

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp, filelog/docker]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
