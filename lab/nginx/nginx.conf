# 实验网关仅代理 lab-api，用于产生 HTTP 5xx 和上游不可用场景。
events {}

http {
  log_format structured escape=json '{"time":"$time_iso8601","status":$status,"request":"$request","upstream":"$upstream_addr","latency":$request_time}';

  server {
    listen 8080;
    access_log /var/log/nginx/access.log structured;

    location / {
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_pass http://lab-api:8080;
    }
  }
}
